[tool.ruff]
line-length = 120
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    # Depends() in a default argument is how FastAPI declares dependencies
    "B008",
    # A bare try/except/pass reads better here than contextlib.suppress
    "SIM105",
    # Class-level mutable defaults are SQLAlchemy and pydantic declarations
    "RUF012",
    # Cyrillic look-alikes are flagged inside the localized message catalog
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
