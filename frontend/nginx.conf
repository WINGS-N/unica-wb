server {
  listen 80;
  server_name _;
  client_max_body_size 5g;

  # The build already wrote .br and .gz next to every asset, so nothing is
  # compressed per request
  brotli_static on;
  gzip_static on;

  # Hashed file names never describe different bytes, so they can be kept
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, immutable, max-age=31536000";
    add_header Vary Accept-Encoding;
    try_files $uri =404;
  }

  location /fonts/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # The worker decides when the app updates, so it must never come from a cache
  location = /sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    add_header Vary Accept-Encoding;
  }

  location / {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    add_header Vary Accept-Encoding;
    try_files $uri /index.html;
  }

  location /api/v1/ {
    proxy_pass http://api:8000/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location = /api/v1/healthz {
    proxy_pass http://api:8000/api/v1/healthz;
  }

  location = /api/v1/readyz {
    proxy_pass http://api:8000/api/v1/readyz;
  }
}
