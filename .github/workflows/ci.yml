name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (prettier + build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

  backend:
    name: Backend (ruff)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install "ruff==0.16.2"

      - name: Lint
        run: ruff check app

      - name: Check formatting
        run: ruff format --check app

      - name: Compile every module
        run: python -m compileall -q app

  desktop:
    name: Desktop (gofmt + vet + test)
    # GTK4 and WebKitGTK 6, which the launcher links against, land in 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: desktop/go.sum

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Staging the interface first is what makes the embed tests meaningful
      - name: Stage the interface
        working-directory: desktop
        run: task webui

      - name: Check formatting
        working-directory: desktop
        run: task fmt:check

      - name: Vet
        working-directory: desktop
        run: task vet

      - name: Test
        working-directory: desktop
        run: task test

  compose:
    name: Compose files
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate the local-repo overlay
        run: docker compose -f docker-compose.yml -f docker-compose.local-repo.yml config --quiet
