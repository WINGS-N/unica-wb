name: Release (tag)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag in vX.Y.Z format'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  PNPM_VERSION: 10.6.2
  NODE_VERSION: 22
  GO_VERSION: "1.25"
  NFPM_VERSION: v2.43.1

jobs:
  prep:
    runs-on: ubuntu-22.04
    outputs:
      owner_lc: ${{ steps.vars.outputs.owner_lc }}
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Set release vars
        id: vars
        shell: bash
        run: |
          TAG_INPUT="${{ github.event.inputs.tag || '' }}"
          TAG="${TAG_INPUT:-${GITHUB_REF_NAME}}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected strict semver tag format: vX.Y.Z"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  # Built once so every package embeds byte-identical assets
  frontend:
    runs-on: ubuntu-22.04
    needs: prep
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the interface
        working-directory: frontend
        env:
          APP_VERSION: ${{ needs.prep.outputs.version }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: webui
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  build-docker-images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-22.04
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: unica-wb-api
            context: .
            file: backend/Dockerfile
            target: api
          - image: unica-wb-worker
            context: .
            file: backend/Dockerfile
            target: worker
          - image: unica-wb-frontend
            context: frontend
            file: frontend/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.tag }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          # The build stack itself is x86 tooling, so the images stay amd64
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ needs.prep.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prep.outputs.owner_lc }}/${{ matrix.image }}:${{ needs.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ needs.prep.outputs.owner_lc }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  build-desktop:
    name: desktop ${{ matrix.arch }}
    needs:
      - prep
      - frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            desktop-file-utils zsync file

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}

      - name: Install appimagetool
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            amd64) asset=appimagetool-x86_64.AppImage ;;
            arm64) asset=appimagetool-aarch64.AppImage ;;
            *) echo "unsupported arch: $ARCH"; exit 1 ;;
          esac
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/$asset"
          sudo chmod +x /usr/local/bin/appimagetool

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Take the prebuilt interface
        uses: actions/download-artifact@v4
        with:
          name: webui
          path: desktop/internal/webui/dist

      - name: Verify the interface landed
        working-directory: desktop
        run: test -f internal/webui/dist/index.html

      - name: Test
        working-directory: desktop
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: task fmt:check vet test

      - name: Build packages
        working-directory: desktop
        env:
          VERSION: ${{ needs.prep.outputs.version }}
          # AppImages cannot be mounted inside a container-less runner sandbox
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: task package

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: desktop/dist
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-22.04
    needs:
      - prep
      - build-docker-images
      - build-desktop
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-linux-*
          path: release
          merge-multiple: true

      - name: Merge the per-arch checksum files
        shell: bash
        working-directory: release
        run: |
          cat checksums_linux_*.txt | sort -k2 > checksums.txt
          rm -f checksums_linux_*.txt
          cat checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep.outputs.tag }}
          name: UN1CA Web Builder ${{ needs.prep.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*
